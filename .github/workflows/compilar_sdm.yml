name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO 6.1.19
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.19"

      - name: Forzar 9600 baudios en el driver SDM
        run: |
          # Sustituir directamente 2400 por 9600 en cualquier linea donde aparezca SDM120_SPEED o SDM220
          find tasmota/ -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i 's/SDM120_SPEED\s\+2400/SDM120_SPEED 9600/g' {} +
          find tasmota/ -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i 's/SDM220_SPEED\s\+2400/SDM220_SPEED 9600/g' {} +
          # Mostrar las lineas modificadas en el log
          grep -rn "SDM120_SPEED" tasmota/ || true

      - name: Compilar firmware tasmota-sensors
        env:
          PLATFORMIO_BUILD_FLAGS: "-DSDM120_SPEED=9600 -DSDM220_SPEED=9600"
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
