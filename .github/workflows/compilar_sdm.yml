name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO y forzar SCons compatible
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pip install --force-reinstall "SCons==4.7.0"

      - name: Eliminar referencia a FortranCommon en todos los scripts
        run: |
          # Elimina el import si existe en pio-tools o en cualquier script del repo
          grep -rl "FortranCommon" . | xargs -r sed -i "s/import SCons.Tool.FortranCommon/# import SCons.Tool.FortranCommon/g" || true
          grep -rl "FortranCommon" /opt/hostedtoolcache | xargs -r sed -i "s/import SCons.Tool.FortranCommon/# import SCons.Tool.FortranCommon/g" || true

      - name: Compilar firmware tasmota-sensors
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
