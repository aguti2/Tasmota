name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO con SCons compatible
        run: |
          python -m pip install --upgrade pip
          pip install "SCons==4.7.0"
          pip install platformio
          # Forzamos a PlatformIO a usar el SCons de Python del sistema
          mkdir -p ~/.platformio/penv/lib/python3.11/site-packages/SCons/Tool 2>/dev/null || true
          touch ~/.platformio/penv/lib/python3.11/site-packages/SCons/Tool/FortranCommon.py 2>/dev/null || true

      - name: Compilar firmware tasmota-sensors
        run: |
          export PLATFORMIO_FORCE_LOCAL_PYTHON=1
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
