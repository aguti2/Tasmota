name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compilar y parchear framework
        run: |
          # Intentamos la compilación; descargará el toolchain y el framework antes de fallar en el linker
          platformio run -e tasmota-sensors || true

          # Parcheamos cualquier referencia a FortranCommon en todos los scripts de la máquina
          find /home/runner -name "elf2bin.py" -exec sed -i "s/import SCons.Tool.FortranCommon/# import SCons.Tool.FortranCommon/g" {} +
          find /home/runner -name "Tool" -type d -exec touch "{}/FortranCommon.py" \;

          # Compilación definitiva con el framework ya parcheado
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
