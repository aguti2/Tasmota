name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO 6.1.19
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.19"

      - name: Forzar 9600 baudios en todo el codigo fuente
        run: |
          echo "=== Buscando y reemplazando SDM120_SPEED en todo el repositorio ==="
          # Reemplaza 2400 por 9600 en cualquier definicion de velocidad de SDM
          find tasmota/ -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i "s/\bSDM120_SPEED\s\+2400\b/SDM120_SPEED 9600/g" {} +
          find tasmota/ -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i "s/\bSDM220_SPEED\s\+2400\b/SDM220_SPEED 9600/g" {} +
          find tasmota/ -type f \( -name "*.h" -o -name "*.c" -o -name "*.cpp" -o -name "*.ino" \) -exec sed -i "s/baudrate = 2400/baudrate = 9600/g" {} +
          
          # Inyecta la definicion global por flag de compilador en platformio_override.ini
          echo "[env:tasmota-sensors]" >> platformio_override.ini
          echo "build_flags = \${env:tasmota-sensors.build_flags} -DSDM120_SPEED=9600 -DSDM220_SPEED=9600" >> platformio_override.ini

          echo "=== Lineas coincidentes tras el reemplazo ==="
          grep -rn "SDM.*_SPEED" tasmota/ || true

      - name: Compilar firmware tasmota-sensors
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
