name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Descargar plataformas y parchear FortranCommon
        run: |
          # Descarga los paquetes de la plataforma espressif8266
          pio pkg install -e tasmota-sensors
          # Elimina el import obsoleto en cualquier script elf2bin.py descargado
          find ~/.platformio -name "elf2bin.py" -exec sed -i "s/import SCons.Tool.FortranCommon/# import SCons.Tool.FortranCommon/g" {} +
          # Parchea también dentro de los directorios de SCons por seguridad
          python3 -c "import sys, glob, os; [open(os.path.join(d, 'FortranCommon.py'), 'a').close() for p in sys.path for d in glob.glob(os.path.join(p, 'SCons', 'Tool'))]" || true

      - name: Compilar firmware tasmota-sensors
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
