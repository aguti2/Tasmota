name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO 6.1.19
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.19"

      - name: Forzar 9600 baudios en el driver SDM120/220
        run: |
          # Reemplaza directamente en el código C del driver cualquier valor de 2400 por 9600
          find tasmota/ -type f -name "*sdm120*.ino" -exec sed -i "s/SDM120_SPEED.*2400/SDM120_SPEED 9600/g" {} +
          find tasmota/ -type f -name "*sdm120*.ino" -exec sed -i "s/define SDM120_SPEED 2400/define SDM120_SPEED 9600/g" {} +
          # Comprobación en consola para verificar el cambio en el código
          grep -rn "SDM120_SPEED" tasmota/ || true

      - name: Compilar firmware tasmota-sensors
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
