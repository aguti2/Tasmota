name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inyectar modulo dummy FortranCommon en SCons
        run: |
          python3 -c "import SCons.Tool, os, sys; p = os.path.join(os.path.dirname(SCons.Tool.__file__), 'FortranCommon.py'); open(p, 'w').write('# dummy module\n'); print('Creado en:', p)"

      - name: Compilar firmware tasmota-sensors
        run: |
          # Si falla la primera pasada al descargar el framework, parcheamos elf2bin.py y reintentamos
          platformio run -e tasmota-sensors || {
            find ~/.platformio -name "elf2bin.py" -exec sed -i "s/import SCons.Tool.FortranCommon/# import SCons.Tool.FortranCommon/g" {} +
            platformio run -e tasmota-sensors
          }

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
