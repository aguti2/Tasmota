name: Compilar Tasmota Sensors ESP8266

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inyectar FortranCommon en el entorno de PlatformIO
        run: |
          # Inicializa el penv de platformio si no estuviera creado
          pio --version
          # Usa el python interno de PlatformIO para crear el archivo dummy
          ~/.platformio/penv/bin/python -c "import SCons.Tool, os; p = os.path.join(os.path.dirname(SCons.Tool.__file__), 'FortranCommon.py'); open(p, 'w').write('# dummy\n'); print('Creado en:', p)" || \
          python3 -c "import site, os, glob; [open(os.path.join(d, 'FortranCommon.py'), 'w').write('# dummy\n') for p in site.getsitepackages() + [os.path.expanduser('~/.platformio/penv/lib')] for d in glob.glob(p + '/**/SCons/Tool', recursive=True)]"

      - name: Compilar firmware tasmota-sensors
        run: |
          platformio run -e tasmota-sensors

      - name: Subir binario como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-sensors-9600
          path: |
            .pio/build/tasmota-sensors/firmware.bin*
            .pio/build/tasmota-sensors/firmware.bin
